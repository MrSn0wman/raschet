    {
      "@type": "Question",
      "name": "Почему рост на 50%, а потом падение на 50% — не возвращает к исходному числу?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Потому что проценты каждый раз считаются от новой базы. 100 → +50% = 150, а 150 → −50% = 75, а не 100."
      }
    },
    {
      "@type": "Question",
      "name": "Как посчитать НДС от суммы?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Используйте режим «Доля от числа»: укажите ставку НДС (например, 20) и сумму без налога — получите сумму налога."
      }
    },
    {
      "@type": "Question",
      "name": "Чем процент отличается от процентного пункта?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Процент — относительная доля, процентный пункт — разница между двумя процентными значениями. Рост ставки с 10% до 12% — это плюс 2 п.&nbsp;п. и плюс 20% в относительном выражении."
      }
    },
    {
      "@type": "Question",
      "name": "Как найти целое, если известна часть и её процент?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Разделите часть на процент, выраженный дробью: целое = часть ÷ (процент ÷ 100). Если 4&nbsp;500&nbsp;₽ — это 15% от суммы, вся сумма равна 30&nbsp;000&nbsp;₽."
      }
    },
    {
      "@type": "Question",
      "name": "Как перевести проценты в десятичную дробь и обратно?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Поделите число процентов на 100: 45% = 0,45. Обратно — умножьте дробь на 100: 0,125 = 12,5%."
      }
    },
    {
      "@type": "Question",
      "name": "Как быстро прикинуть процент в уме?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Найдите 10% — поделите число на 10 — и комбинируйте: 15% — это 10% плюс половина от 10%. От 2&nbsp;400&nbsp;₽ получится 240 + 120 = 360&nbsp;₽."
      }
    }
  ]
}
