<script>

const SAFE_CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const DIGITS_CHARSET = '0123456789';

function secureIndex(max){const a=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=limit);return x%max;}
function generatePromoCodes(count, length, prefix, charset){
  const codes = new Set();
  let attempts = 0;
  while (codes.size < count && attempts < count * 50){
    let code = prefix || '';
    for (let j = 0; j < length; j++){
      code += charset[secureIndex(charset.length)];
    }
    codes.add(code);
    attempts++;
  }
  return [...codes];
}

function doGenerate(){
  const prefixEl = document.getElementById('prefix');
  const lengthEl = document.getElementById('code-length');
  const countEl = document.getElementById('code-count');
  const digitsOnlyEl = document.getElementById('use-digits-only');
  const errEl = document.getElementById('err');

  const prefix = prefixEl.value;
  const length = parseInt(lengthEl.value, 10);
  const count = parseInt(countEl.value, 10);
  const charset = digitsOnlyEl.checked ? DIGITS_CHARSET : SAFE_CHARSET;

  if (isNaN(length) || length <= 0 || length > 32 || isNaN(count) || count <= 0 || count > 500){
    errEl.style.display = 'block';
    document.getElementById('r-codes').textContent = '—';
    return;
  }
  errEl.style.display = 'none';

  const codes = generatePromoCodes(count, length, prefix, charset);
  document.getElementById('r-codes').textContent = codes.join('\n');
}

document.addEventListener('DOMContentLoaded', () => {
  ['prefix','code-length','code-count'].forEach(id => document.getElementById(id).addEventListener('input', doGenerate));
  document.getElementById('use-digits-only').addEventListener('change', doGenerate);
  document.getElementById('generate-btn').addEventListener('click', doGenerate);
  doGenerate();
});

</script>

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){

  });
}
</script>
