      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Наименьшее общее кратное (НОК) — это самое маленькое натуральное число, которое делится без остатка на каждое из заданных чисел."
      }
    },
    {
      "@type": "Question",
      "name": "Как связаны НОК и НОД?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Для двух чисел выполняется равенство: НОК(a, b) × НОД(a, b) = a × b. Поэтому, найдя НОД по алгоритму Евклида, НОК вычисляют простым делением произведения чисел на их НОД."
      }
    },
    {
      "@type": "Question",
      "name": "Где на практике нужен НОК?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Чаще всего — при сложении и вычитании дробей с разными знаменателями: НОК знаменателей даёт наименьший общий знаменатель для приведения дробей."
      }
    },
    {
      "@type": "Question",
      "name": "Чему равен НОК взаимно простых чисел?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Если у чисел нет общих делителей, кроме единицы, их НОК равен их произведению — например, НОК(8, 15) = 120."
      }
    },
    {
      "@type": "Question",
      "name": "Как найти НОК трёх и более чисел?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "По цепочке: сначала находят НОК первых двух чисел, затем НОК полученного результата с третьим числом — и так до конца списка."
      }
    },
    {
      "@type": "Question",
      "name": "Может ли НОК быть меньше самих чисел?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Нет. НОК всегда не меньше наибольшего из заданных чисел, ведь кратное числа не может быть меньше самого числа."
      }
    }
  ]
