<script>

function parseList(text){
  return text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
}

function secureInt(max){const a=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=limit);return x%max;}
function shuffleArray(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = secureInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function doShuffle(){
  const listEl = document.getElementById('list-input');
  const errEl = document.getElementById('err');
  const items = parseList(listEl.value);

  if (items.length === 0){
    errEl.style.display = 'block';
    document.getElementById('r-result').textContent = '—';
    return;
  }
  errEl.style.display = 'none';

  const shuffled = shuffleArray(items);
  document.getElementById('r-result').textContent = shuffled.map((it,i) => (i+1) + '. ' + it).join('\n');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('list-input').addEventListener('input', doShuffle);
  document.getElementById('shuffle-btn').addEventListener('click', doShuffle);
  doShuffle();
});

</script>
<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('../sw.js').catch(function(){});
  });
}
</script>
