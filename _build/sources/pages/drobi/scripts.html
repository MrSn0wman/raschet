<script>

function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a; }

function simplifyFraction(num, den){
  if (den < 0){ num=-num; den=-den; }
  const g = gcd2(num,den) || 1;
  return { num: num/g, den: den/g };
}

function fractionOp(n1,d1,n2,d2,op){
  let rn, rd;
  if (op === '+'){ rn = n1*d2 + n2*d1; rd = d1*d2; }
  else if (op === '-'){ rn = n1*d2 - n2*d1; rd = d1*d2; }
  else if (op === '*'){ rn = n1*n2; rd = d1*d2; }
  else if (op === '/'){ rn = n1*d2; rd = d1*n2; }
  return simplifyFraction(rn, rd);
}

function recalcFractions(){
  const n1El = document.getElementById('n1');
  const d1El = document.getElementById('d1');
  const n2El = document.getElementById('n2');
  const d2El = document.getElementById('d2');
  const opEl = document.getElementById('operation');
  const errEl = document.getElementById('err');

  const n1 = parseInt(n1El.value, 10);
  const d1 = parseInt(d1El.value, 10);
  const n2 = parseInt(n2El.value, 10);
  const d2 = parseInt(d2El.value, 10);
  const op = opEl.value;

  if (isNaN(n1) || isNaN(d1) || isNaN(n2) || isNaN(d2) || d1 === 0 || d2 === 0 || (op === '/' && n2 === 0)){
    errEl.style.display = 'block';
    document.getElementById('r-result').textContent = '—';
    document.getElementById('r-decimal').textContent = '—';
    document.getElementById('r-mixed').textContent = '—';
    return;
  }
  errEl.style.display = 'none';

  const result = fractionOp(n1,d1,n2,d2,op);

  document.getElementById('r-result').textContent = result.den === 1 ? String(result.num) : (result.num + ' / ' + result.den);
  document.getElementById('r-decimal').textContent = (result.num/result.den).toLocaleString('ru-RU', { maximumFractionDigits: 6 });

  const whole = Math.trunc(result.num / result.den);
  const remainder = Math.abs(result.num % result.den);
  if (remainder === 0 || result.den === 1){
    document.getElementById('r-mixed').textContent = String(whole);
  } else if (whole === 0){
    document.getElementById('r-mixed').textContent = result.num + '/' + result.den;
  } else {
    document.getElementById('r-mixed').textContent = whole + ' целых ' + remainder + '/' + result.den;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  ['n1','d1','n2','d2'].forEach(id => document.getElementById(id).addEventListener('input', recalcFractions));
  document.getElementById('operation').addEventListener('change', recalcFractions);
  recalcFractions();
});

</script>
<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('../sw.js').catch(function(){});
  });
}
</script>
