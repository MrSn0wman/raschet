<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{ margin:0; padding:0; }
  .tile{ width:512px; height:512px; background:#0E7A4A; display:flex; align-items:center; justify-content:center; }
  svg{ width:290px; height:290px; }
</style>
</head>
<body>
<div class="tile">
  <svg viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
    <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
    <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
    <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
  </svg>
</div>
</body>
</html>
