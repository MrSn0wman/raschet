<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{ margin:0; padding:0; background:transparent; }
  .stage{ width:512px; height:512px; display:flex; align-items:center; justify-content:center; }
  .tile{ width:512px; height:512px; border-radius:112px; background:#0E7A4A; display:flex; align-items:center; justify-content:center; }
  svg{ width:330px; height:330px; }
</style>
</head>
<body>
<div class="stage">
  <div class="tile">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
      <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
      <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
      <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="#FFFFFF" stroke-width="1.8"/>
    </svg>
  </div>
</div>
</body>
</html>
